name: Auto Forecast and Deploy

on:
  # 每 3 小時自動醒來一次 (UTC 0, 3, 6, 9...)
  schedule:
    - cron: '0 */3 * * *'
  # 允許你手動點擊測試
  workflow_dispatch:

permissions:
  contents: write # 允許自動上傳圖片更新網頁

jobs:
  build-and-plot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas numpy matplotlib scipy shapely cartopy tcmarkers

    - name: Install Chinese Fonts
      run: |
        sudo apt-get update
        sudo apt-get install -y fonts-wqy-microhei

    # 1. 執行畫圖 (你的 plot_all_tc.py 會自己去 TC-Track 抓 CSV)
    - name: Run plot script
      run: python plot_all_tc.py

    # 2. 自動把新圖上傳回 HKMO_TC，讓網站自動更新
    - name: Commit and push updated plots
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add output/*.png
        
        if ! git diff --cached --quiet; then
          git fetch origin main
          git reset --soft origin/main
          git add output/*.png
          git commit -m "chore: auto-update all TC forecast plots [skip ci]"
          git push
        else
          echo "圖片無變化，不提交"
        fi

    # 3. 發送到 Telegram (直接從遠端 TC-Track 抓公告文字)
    - name: Send TC forecast to Telegram
      env:
        BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.TELEGRAM_TO }}
      run: |
        cat << 'EOF' > send_tg.py
        import requests, json, os, sys
        
        token = os.environ.get('BOT_TOKEN')
        chat_id = os.environ.get('CHAT_ID')
        
        # TC-Track 遠端路徑
        TC_TRACK_URL = "https://raw.githubusercontent.com/zax41006-bot/TC-Track/main"
        
        with open('tc_config.json', 'r', encoding='utf-8-sig') as f:
            tc_list = json.load(f)
            
        for tc in tc_list:
            tc_id = tc['id']
            image_path = f'output/forecast_{tc_id}.png'
            
            if not os.path.exists(image_path):
                print(f'❌ [{tc_id}] 找不到圖片 {image_path}')
                sys.exit(1)
                
            # 從 TC-Track 抓取專屬公告或通用公告
            caption = ''
            try:
                resp_notice = requests.get(f"{TC_TRACK_URL}/notice_{tc_id}.txt?t={os.urandom(4).hex()}", timeout=10)
                if resp_notice.status_code == 200:
                    caption = resp_notice.text
                else:
                    resp_generic = requests.get(f"{TC_TRACK_URL}/notice.txt?t={os.urandom(4).hex()}", timeout=10)
                    if resp_generic.status_code == 200:
                        caption = resp_generic.text
            except Exception as e:
                print(f"⚠️ [{tc_id}] 無法讀取遠端公告: {e}")
            
            # TG 限制字數
            if len(caption) > 1000:
                caption = caption[:1000] + '\n...(截斷)'
                    
            url = f'https://api.telegram.org/bot{token}/sendPhoto'
            with open(image_path, 'rb') as photo:
                print(f'🚀 [{tc_id}] 正在發送到 Telegram...')
                resp = requests.post(url, files={'photo': photo}, data={'chat_id': chat_id, 'caption': caption})
                
                if resp.status_code != 200:
                    print(f'❌ [{tc_id}] 發送失敗: {resp.text}')
                    sys.exit(1)
                else:
                    print(f'✅ [{tc_id}] 發送成功！')
        EOF
        python send_tg.py
